name: Türkçe Windows derlemesi

# Builds the Turkish ZigZag for Windows from the turkce branch and puts the
# zip on the "turkce-son" pre-release, replacing the previous one.

on:
  push:
    branches: [turkce]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkce-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: turkce

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: turkce-windows

      - name: Regenerate AppIcon.ico
        shell: pwsh
        run: |
          python -m pip install --upgrade --quiet pillow
          python packaging/windows/make-icon.py

      - name: Build release binaries
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >
          cargo build --locked --release
          --features gui,ble
          --target x86_64-pc-windows-msvc
          --bin zigzag-studio --bin zigzag --bin zigzag-mcp

      - name: Stage zip
        id: stage
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $name = "ZigZag-$ver-tr-x86_64-windows"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = "target\x86_64-pc-windows-msvc\release"
          Copy-Item "$bin\zigzag-studio.exe" "$stage\ZigZag.exe"
          Copy-Item "$bin\zigzag.exe"        "$stage\zigzag-cli.exe"
          Copy-Item "$bin\zigzag-mcp.exe"    "$stage\"
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md "$stage\"
          $help = & "$stage\ZigZag.exe" --help
          if ($LASTEXITCODE -ne 0 -or "$help" -notmatch 'usage: zigzag-studio') { throw "Studio failed its startup check." }
          $zip = "dist\$name.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          "zip=$zip"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ver=$ver"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish to the turkce-son pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $notes = "Türkçe ZigZag ${{ steps.stage.outputs.ver }}, turkce dalının son hâli (${{ github.sha }}). Zip'i indirip açın, ZigZag.exe'yi çalıştırın."
          gh release delete turkce-son --repo $repo --yes --cleanup-tag 2>$null
          gh release create turkce-son --repo $repo --prerelease --target "${{ github.sha }}" `
            --title "Türkçe ZigZag ${{ steps.stage.outputs.ver }} (son derleme)" --notes $notes `
            "${{ steps.stage.outputs.zip }}"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.zip }}
